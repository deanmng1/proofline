name: Prepare Verified Preview

# Prepared/tested only. Live preview requires an explicitly authorized manual dispatch.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit from successful push/main canonical verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: proofline-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Verify exact hosted artifact and write supplementary observation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          node tools/proofline/hosted-proof.mjs
          --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_COMMIT"
          --directory "$RUNNER_TEMP/verified-release"
          --receipt "$RUNNER_TEMP/observation.json"
      - name: Require preview credentials before provider invocation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PREVIEW_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Preview project credentials are required}"
          : "${VERCEL_ORG_ID:?Preview project credentials are required}"
          : "${VERCEL_PROJECT_ID:?Preview project credentials are required}"
      - name: Deploy exact verified preview output
        working-directory: ${{ runner.temp }}/verified-release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PREVIEW_PROJECT_ID }}
        run: npm exec --yes --package=vercel@65.11.0 -- vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN"
      - name: Preserve artifact observation only; deployment identity remains separately verifiable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofline-observation-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation.json
          if-no-files-found: error
          retention-days: 14
