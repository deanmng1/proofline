name: Deploy Demo

# Deploy only the exact static artifact from complete successful verification.
on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Resolve release commit and verify immutable production artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROOFLINE_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node tools/proofline/release-verify.mjs

      - name: Deploy exact verified prebuilt static output
        working-directory: verified-release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Production project credentials are required}"
          : "${VERCEL_ORG_ID:?Production project credentials are required}"
          : "${VERCEL_PROJECT_ID:?Production project credentials are required}"
          npm exec --yes --package=vercel@65.11.0 -- vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
