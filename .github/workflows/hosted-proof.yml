name: Audit Hosted Proof

# Read-only observation; dispatch never produces a release-eligible build artifact.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character source commit from successful push/main verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Verify exact hosted artifact and write supplementary observation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          node tools/proofline/hosted-proof.mjs
          --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_COMMIT"
          --directory "$RUNNER_TEMP/verified-release"
          --receipt "$RUNNER_TEMP/observation.json"
      - name: Preserve successful read-only observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofline-observation-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation.json
          if-no-files-found: error
          retention-days: 14
